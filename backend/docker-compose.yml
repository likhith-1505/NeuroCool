services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-neurocool}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-neurocool}
      POSTGRES_DB: ${POSTGRES_DB:-neurocool}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-neurocool} -d ${POSTGRES_DB:-neurocool}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Forwards every variable in backend/.env into the container as-is
    # (AI_PROVIDER, ANTHROPIC_API_KEY, OPENAI_API_KEY, GEMINI_API_KEY, the
    # AI_*_TIMEOUT_SECONDS/AI_MAX_RESPONSE_TOKENS knobs, etc.) — the
    # `${VAR}` substitutions below are a separate compose-file mechanism
    # and never actually injected those into the container on their own.
    # `environment:` entries still take precedence over env_file for the
    # handful of vars listed in both, which is what supplies sane defaults
    # even when backend/.env doesn't exist at all.
    env_file:
      - path: .env
        required: false
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PROJECT_NAME: ${PROJECT_NAME:-NeuroCool Backend}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      POSTGRES_USER: ${POSTGRES_USER:-neurocool}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-neurocool}
      POSTGRES_DB: ${POSTGRES_DB:-neurocool}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: ${REDIS_DB:-0}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
